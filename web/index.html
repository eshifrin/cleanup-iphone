<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone Layout Drag-and-Drop Planner</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="layout-page">
  <div class="layout-shell">
    <header class="layout-header">
      <h1>iPhone Layout Planner</h1>
      <p>One long page with each iPhone page represented as a grid of drop targets. Drag apps or folders and reorder instantly.</p>
    </header>

    <main class="layout-main">
      <aside class="tray">
        <h2>Fixture Controls</h2>
        <p id="fixture-info">Loading default fixture...</p>
        <div class="tray-list">
          <button id="load-default-btn" type="button">Load demo fixture</button>
          <button id="reset-button" type="button">Reset current layout</button>
          <label>
            Upload fixture JSON
            <input id="fixture-input" type="file" accept=".json,application/json">
          </label>
        </div>
      </aside>

      <section>
        <div id="planner" class="board-wrap" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
